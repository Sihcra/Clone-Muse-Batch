appId: com.musebatch.studio
productName: MuseBatch Studio
directories:
  output: dist
  buildResources: resources

files:
  - src/**/*
  - ui/**/*
  - package.json
  - "!**/*.test.js"

# ffmpeg.exe, ffprobe.exe và các DLL đi kèm: chép từ Vanh\resources\bin vào resources\bin trước khi build
extraResources:
  - from: resources/bin
    to: bin
    filter:
      - "**/*"

win:
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: MuseBatch Studio

# macOS: build DMG không ký (chưa có Developer ID). Lần đầu mở: chuột phải → Open.
# ffmpeg mặc định lấy từ Homebrew (/opt/homebrew/bin, /usr/local/bin), không đóng gói.
mac:
  target:
    - target: dmg
      arch:
        - arm64
        - x64
  category: public.app-category.productivity
  identity: null
