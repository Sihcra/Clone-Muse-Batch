appId: com.musebatch.studio
productName: MuseBatch Studio
directories:
  output: dist
  buildResources: resources

files:
  - src/**/*
  - ui/**/*
  - package.json
  - "!**/*.test.js"

# ffmpeg.exe, ffprobe.exe và các DLL đi kèm: chép vào resources\bin trước khi build (không đưa lên git)
extraResources:
  - from: resources/bin
    to: bin
    filter:
      - "**/*"

win:
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: MuseBatch Studio
